name: Windows desktop build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Windows client dependencies
        run: python -m pip install -r requirements-windows.txt

      - name: Run Windows client tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s windows_app -p 'test_*.py' -v

      - name: Run Cangjie reference checks when the SDK is available
        shell: pwsh
        run: |
          if (Get-Command cjpm -ErrorAction SilentlyContinue) {
            cjpm test --no-run
          } else {
            Write-Host 'Cangjie SDK is not installed on this runner; Windows client checks remain authoritative.'
          }

      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm packaging/windows.spec

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist/Suishouji.exe, README.md -DestinationPath dist/suishouji-windows-x64.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: suishouji-windows-x64
          path: dist/suishouji-windows-x64.zip
